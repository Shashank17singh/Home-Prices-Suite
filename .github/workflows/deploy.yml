name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            # Try to pull latest code in both possible directories
            if [ -d "/home/ubuntu/BangloreHomePrices" ]; then
              cd /home/ubuntu/BangloreHomePrices
              git pull origin main || true
              sudo systemctl restart bhp || sudo systemctl restart gunicorn || true
              sudo pkill -f gunicorn || true
            fi
            
            if [ -d "/home/ubuntu/Home-Prices-API" ]; then
              cd /home/ubuntu/Home-Prices-API
              git pull origin main || true
              
              # Forcefully kill ANY rogue process still holding port 5000 safely
              sudo python3 -c 'import os, socket; [os.kill(int(p), 9) for p in os.popen("lsof -t -i:5000").read().split() if p]' || true
              sudo ss -lptn 'sport = :5000' | grep -o 'pid=[0-9]*' | cut -d= -f2 | xargs -r sudo kill -9 || true
              
              # Build and start the Docker containers (without sudo so PATH is correct)
              docker compose up -d --build || docker-compose up -d --build || true
            fi
