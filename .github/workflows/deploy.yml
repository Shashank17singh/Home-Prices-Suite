name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            # The actual live website is hosted from BangloreHomePrices directory
            if [ -d "/home/ubuntu/BangloreHomePrices" ]; then
              cd /home/ubuntu/BangloreHomePrices
              git pull origin main
              
              # Restart the systemd service (trying common names)
              sudo systemctl restart bhp || sudo systemctl restart gunicorn || true
              
              # Force kill gunicorn to ensure systemd spawns a new one with updated code
              sudo pkill -f gunicorn || true
            else
              # Fallback to Docker approach if BangloreHomePrices doesn't exist
              cd /home/ubuntu/Home-Prices-API
              git pull origin main
              sudo docker-compose up -d --build
            fi
