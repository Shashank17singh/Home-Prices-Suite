name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            # Try to force-update code in both possible directories bypassing git pull
            if [ -d "/home/ubuntu/BangloreHomePrices/server" ]; then
              wget -qO /home/ubuntu/BangloreHomePrices/server/util.py https://raw.githubusercontent.com/Shashank17singh/Home-Prices-API/main/server/util.py
              wget -qO /home/ubuntu/BangloreHomePrices/server/server.py https://raw.githubusercontent.com/Shashank17singh/Home-Prices-API/main/server/server.py
              
              # Restart the systemd service (trying common names)
              sudo systemctl restart bhp || sudo systemctl restart gunicorn || true
              sudo pkill -f gunicorn || true
            fi
            
            if [ -d "/home/ubuntu/Home-Prices-API/server" ]; then
              cd /home/ubuntu/Home-Prices-API
              git pull origin main || true
              
              # Forcefully kill ANY rogue process still holding port 5000 safely
              sudo python3 -c 'import os, socket; [os.kill(int(p), 9) for p in os.popen("lsof -t -i:5000").read().split() if p]' || true
              sudo ss -lptn 'sport = :5000' | grep -o 'pid=[0-9]*' | cut -d= -f2 | xargs -r sudo kill -9 || true
              
              # Build and start the Docker containers
              docker compose up -d --build || docker-compose up -d --build || true
            fi
            
            # Ensure script exits with 0
            exit 0
